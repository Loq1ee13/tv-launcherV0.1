plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.tvlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.tvlauncher'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
